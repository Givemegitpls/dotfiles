# More option see https://mangowm.github.io/docs/

# scroller layout setting
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=0
edge_scroller_pointer_focus=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# master-stack layout setting
new_is_master=0
default_master_factor=0.55
default_master_count=1
smart_gaps=0
tag_gather=1

# overview setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.6

# misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_corner=4
cursor_theme=Graphite-Recolored-Dracula-Cyan
cursor_hide_timeout=15

# layout support:
# https://mangowm.github.io/docs/window-management/layouts
tag_num=16

tag_rule=id:*,layout_name:fair

# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# import other parts of config
source=~/.config/mango/binds.conf
source=~/.config/mango/input.conf
source=~/.config/mango/visual.conf
source=~/.config/mango/rules.conf

# run autostart
exec_once=~/.scripts/base/autostart.sh
exec_once=uwsm app -- waymonman
