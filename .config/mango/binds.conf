# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
keymode=common

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER,r,spawn,rofi -show drun
bind=SUPER,e,spawn,thunar
bind=SUPER,q,spawn,kitty
bind=CTRL+ALT,l,spawn,loginctl lock-session
bind=SUPER,w,spawn,uwsm app -- ~/.config/waybar/scripts/waybar_toggle.sh

# clipboard
bind=SUPER,v,spawn,$HOME/.config/rofi/scripts/cliphist/entrypoint.sh
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=none,Print,spawn_shell,grim - | wl-copy

# exit
bind=SUPER,m,spawn,$HOME/.config/rofi/scripts/uwsm-exit-menu/entrypoint.sh
bind=SUPER,c,killclient
bind=none,XF86PowerOff,spawn,$HOME/.config/rofi/scripts/power-menu/entrypoint.sh

# multimedia binds
bind=none,XF86AudioRaiseVolume,spawn_shell,~/.scripts/media/volume-changer.sh up
bind=none,XF86AudioLowerVolume,spawn_shell,~/.scripts/media/volume-changer.sh down
bind=none,XF86AudioMute,spawn,~/.scripts/media/volume-mute.sh
bind=none,XF86AudioMicMute,spawn,~/.scripts/media/microphone-toggle.sh
bind=none,XF86AudioStop,spawn,playerctl stop
bind=none,XF86AudioPrev,spawn_shell,~/.scripts/media/playerctl-notifier.sh previous
bind=none,XF86AudioNext,spawn_shell,~/.scripts/media/playerctl-notifier.sh next
bind=none,XF86AudioPlay,spawn,playerctl play-pause

# brightness binds
bind=none,XF86KbdBrightnessUp,spawn,brightnessctl --device='asus::kbd_backlight' set 1+
bind=none,XF86KbdBrightnessDown,spawn,brightnessctl --device='asus::kbd_backlight' set 1-
bind=none,XF86MonBrightnessUp,spawn_shell,emonbrighter up
bind=none,XF86MonBrightnessDown,spawn_shell,emonbrighter down
bind=SUPER+ALT,Up,spawn,monbrighter up
bind=SUPER+ALT,Down,spawn,monbrighter down

# asus binds
bind=none,XF86Launch1,spawn,~/.scripts/asus/ROGprofiler.sh

# lid binds
switchbind=fold,spawn,~/.scripts/laptop/eDPower.sh
switchbind=unfold,spawn_shell,wlr-randr --output eDP-1 --on

# switch window focus
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right

bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right

# switch window status
bind=SUPER,g,toggleglobal
bind=ALT,Tab,toggleoverview
bind=ALT,backslash,togglefloating
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,i,minimized
bind=SUPER,o,toggleoverlay
bind=SUPER+SHIFT,i,restore_minimized
bind=ALT,z,toggle_scratchpad

# switch layout
bind=SUPER,n,switch_layout

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=ALT,1,tagsilent,1
bind=SUPER,1,tag,1,0
bind=SUPER,2,tag,2,0
bind=SUPER,3,tag,3,0
bind=SUPER,4,tag,4,0
bind=SUPER,5,tag,5,0
bind=SUPER,6,tag,6,0
bind=SUPER,7,tag,7,0
bind=SUPER,8,tag,8,0
bind=SUPER,9,tag,9,0

# monitor switch
bind=SUPER,TAB,focusmon,right
bind=SUPER+SHIFT,Tab,tagmon,right

# movewin
# bind=CTRL+ALT,Up,movewin,+0,-50
# bind=CTRL+ALT,Down,movewin,+0,+50
# bind=CTRL+ALT,Left,movewin,-50,+0
# bind=CTRL+ALT,Right,movewin,+50,+0

# resizewin
bind=CTRL+SHIFT,Up,resizewin,+0,-50
bind=CTRL+SHIFT,Down,resizewin,+0,+50
bind=CTRL+SHIFT,Left,resizewin,-50,+0
bind=CTRL+SHIFT,Right,resizewin,+50,+0

bind=CTRL+SHIFT,k,resizewin,+0,-50
bind=CTRL+SHIFT,j,resizewin,+0,+50
bind=CTRL+SHIFT,h,resizewin,-50,+0
bind=CTRL+SHIFT,l,resizewin,+50,+0

# mouse button bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize

# scroller layout ------------------------------------------------------------------ #
# keymode=scroller

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,scroller_stack,left
bind=SUPER+SHIFT,Right,scroller_stack,right

bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,scroller_stack,left
bind=SUPER+SHIFT,l,scroller_stack,right

# tag switch
bind=SUPER,a,focusdir,left
bind=SUPER,d,focusdir,right
bind=SUPER+SHIFT,a,exchange_client,left
bind=SUPER+SHIFT,d,exchange_client,right

# touchpad gestures
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right

# axis bindings
axisbind=SUPER,Up,focusdir,left
axisbind=SUPER,Down,focusdir,right

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset

# master layout -------------------------------------------------------------------- #
keymode=master

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# tag switch
bind=SUPER,a,viewtoleft,0
bind=SUPER,d,viewtoright,0
bind=SUPER+SHIFT,a,tagtoleft,0
bind=SUPER+SHIFT,d,tagtoright,0

# touchpad gestures
# gesturebind=none,right,3,viewtoleft_have_client
# gesturebind=none,left,3,viewtoright_have_client

# axis bindings
# axisbind=SUPER,Up,viewtoleft_have_client
# axisbind=SUPER,Down,viewtoright_have_client

# inc nmaster
bind=SUPER,Equal,incnmaster,+1
bind=SUPER,Minus,incnmaster,-1
