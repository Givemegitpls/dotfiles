# [[manager.prepend_keymap]]
[mgr]
prepend_keymap = [
  { on = [":"], run = 'shell "$SHELL" --block --confirm', desc = "Open shell here" },
  { on = ["q"], run = "close", desc = "Close the current tab, or quit if it is last tab" },
  { on = ["g", "e"], run = "cd /etc", desc = "Go to /etc" },
  { on = ["g", "r"], run = "cd /", desc = "Go to /" },
  { on = ["g", "s"], run = "cd /srv", desc = "Go to /srv" },
  { on = ["g", "u"], run = "cd /usr", desc = "Go to /usr" },
  { on = ["g", "v"], run = "cd /var", desc = "Go to /var" },
  { on = ["v"], run = "select_all --state=true", desc = "Select all files" },
  { on = ["V"], run = "visual_mode", desc = "Enter visual mode" },
  { on = ["D", "<Enter>"], run = "remove --force --permanently", desc = "Permanently delete files" },

  # Mount
  { on = ["M", "m"], run = "plugin gvfs -- select-then-mount --jump", desc = "Select device to mount and jump to its mount point" },
  { on = ["M", "u"], run = "plugin gvfs -- select-then-unmount", desc = "Select device then unmount" },
  { on = ["M", "a"], run = "plugin gvfs -- add-mount", desc = "Add a GVFS mount URI" },
  { on = ["M", "e"], run = "plugin gvfs -- edit-mount", desc = "Edit a GVFS mount URI" },
  { on = ["M", "r"], run = "plugin gvfs -- remove-mount", desc = "Remove a GVFS mount URI" },
  { on = ["g", "m"], run = "plugin gvfs -- jump-to-device", desc = "Select device then jump to its mount point" },

  # clipboard (symlink to original plugin must be created)
  { on = "y", run = ["yank", "plugin system-clipboard -- --action=copy"], desc = "Yank selected files (copy)" },
  { on = "x", run = ["yank --cut", "plugin system-clipboard -- --action=copy"], desc = "Yank selected files (cut)" },
  { on = "<C-p>", run = ["plugin system-clipboard -- --action=paste"], desc = "Paste yanked system clipboard files" }
]
