general.import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[colors.primary]
background = "#0e1219"

[window]
opacity = 0.4

[window.padding]
x = 30
y = 30

[env]
TERM = "xterm-256color"

[font]
size = 14.0
builtin_box_drawing = true

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = -1
